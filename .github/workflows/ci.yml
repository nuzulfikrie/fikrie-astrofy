name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (astro check)
        run: npm run lint

      - name: Audit for critical vulnerabilities
        run: |
          for i in 1 2 3; do
            npm audit --audit-level=critical && exit 0
            echo "Audit attempt $i failed, retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx --yes firebase-tools deploy --only hosting --project fikriesalam-static-devsite --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
